# Runs the six host suites on every push and PR.
#
# `make -C host test` deliberately excludes `play`, which is macOS-only
# (CoreAudio), so the whole suite runs on a Linux runner. Only the DaisySP
# submodule is needed — nothing under src/engine/ may include libDaisy, which
# is what keeps this job cheap.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and run every suite
        run: make -C host test

      - name: Render a WAV, to prove the engine still runs end to end
        run: make -C host run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ruff
      - run: ruff check .

